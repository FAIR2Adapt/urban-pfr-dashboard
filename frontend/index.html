<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Flood-Risk Dashboard</title>
  <!-- all libraries vendored under vendor/, no CDN at run time (README, "Built with") -->
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css"/>
  <link rel="stylesheet" href="vendor/maplibre-gl.css"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
<div class="container">
  <aside class="sidebar">
    <div class="logo">
      <h1>Flood-Risk Dashboard</h1>
      <p>Urban Pluvial Flood Risk Assessment</p>
    </div>

    <div class="section">
      <h3 class="section-title">Cities</h3>
      <select id="sourceSelector" class="dropdown"></select>
    </div>

    <div class="section" id="viewSection" style="display:none">
      <h3 class="section-title">View</h3>
      <select id="viewSelector" class="dropdown"></select>
    </div>

    <div class="section" id="visualizationSelector">
      <div class="viz-setup" id="vizSetup">
        <p class="viz-setup-title">No data configured yet</p>
        <p class="viz-setup-hint">See the README section <em>Configuration</em>.</p>
      </div>
    </div>

    <div class="section">
      <h3 class="section-title">Basemap</h3>
      <div id="basemapSelector" class="basemap-list"></div>
    </div>

    <div class="section" id="metadataSection" style="display:none">
      <h3 class="section-title">Record</h3>
      <button type="button" id="metaToggle" class="meta-link" aria-pressed="false" aria-controls="recordPanel">Statements and data</button>
    </div>
  </aside>

  <main class="main-content">
    <header class="header">
      <div class="header-left">
        <h2 id="currentTitle">Loading…</h2>
        <p id="currentSubtitle"></p>
      </div>
    </header>

    <section id="contextStrip" class="context-strip hidden" aria-label="Scientific context of the map"></section>

    <div class="work">
    <div class="map-container">
      <div id="map"></div>
      <div id="glmap" style="display:none"></div>

      <div id="loadingOverlay" class="loading-overlay hidden">
        <div id="spinner" class="spinner"></div>
        <p>Loading data…</p>
      </div>

      <div class="legend-panel" id="legendPanel">
        <h4>Legend</h4>
        <div id="legendContent"></div>
      </div>

    </div>

    <aside id="recordPanel" class="record-panel hidden" aria-label="Record">
      <div class="rp-head">
        <div class="rp-title">
          <span class="rp-kind" id="rpKind">Record</span>
          <h3 id="rpTitle"></h3>
          <p id="rpMeta"></p>
        </div>
        <button type="button" class="rp-close" id="metaClose" aria-label="Close the record panel">✕</button>
      </div>
      <div class="rp-tabs" role="tablist" id="rpTabs"></div>
      <div class="rp-body" id="rpBody"></div>
    </aside>
    </div>
  </main>
</div>

<script src="vendor/leaflet/leaflet.js"></script>

<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/pmtiles.js"></script>
<script src="vendor/flatgeobuf/flatgeobuf-geojson.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
