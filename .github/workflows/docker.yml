name: Docker

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Build and run
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # the image with the FDO reader, at the release the dashboard is tested with
      - name: Build image
        run: >
          docker build -t urban-pfr-dashboard:test
          --build-arg FDO_CONSUME_PIP="git+https://github.com/${{ vars.FDO_CONSUME_REPOSITORY || 'FAIR2Adapt/fdo-consume' }}@${{ vars.FDO_CONSUME_REF || 'v1.1.0' }}" .

      # the test objects are not in the image; they are mounted read-only
      - name: Start container
        run: docker run -d --name dashboard-test -p 8000:8000 -v "$PWD/test-data:/app/test-data:ro" urban-pfr-dashboard:test

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/sources >/dev/null; then
              echo "server is up"
              exit 0
            fi
            sleep 2
          done
          docker logs dashboard-test || true
          exit 1

      - name: Check a composed dataset
        run: |
          curl -fsS http://localhost:8000/api/sources/fdo-dashboard-demo/dataset -o dataset.json
          python3 -c "import json; d = json.load(open('dataset.json')); assert d['plan']['status'] == 'PASS', d['plan']['status']; assert any(l['drawable'] for l in d['layers'].values())"

      - name: Logs
        if: always()
        run: docker logs dashboard-test || true

      - name: Stop container
        if: always()
        run: docker rm -f dashboard-test || true
